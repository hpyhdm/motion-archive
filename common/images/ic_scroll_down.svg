<svg xmlns="http://www.w3.org/2000/svg" width="26" height="48" viewBox="0 0 26 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
    <style>
        .wheel { animation: wheel 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
        .arrow { animation: arrow 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
        @keyframes wheel {
            0% { transform: translateY(0); opacity: 1; }
            70% { transform: translateY(7px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0; }
        }
        @keyframes arrow {
            0%, 20% { transform: translateY(0); opacity: 0.3; }
            60% { transform: translateY(3px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.3; }
        }
        @media (prefers-reduced-motion: reduce) {
            .wheel, .arrow { animation: none; }
        }
    </style>
    <!-- mouse body / 마우스 몸체 -->
    <rect x="2" y="1" width="22" height="34" rx="11"/>
    <!-- wheel / 휠 -->
    <line class="wheel" x1="13" y1="8" x2="13" y2="13"/>
    <!-- arrow / 화살표 -->
    <polyline class="arrow" points="8,40 13,45 18,40"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
