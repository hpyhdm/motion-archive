<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <title>archive.hpyhdm.me</title>
</head>
<body>
<div id="wrap">
    <!-- Static header for the index page (prototype pages use mountHeader) -->
    <!-- 목록 페이지용 정적 헤더 (프로토타입 페이지는 mountHeader 사용) -->
    <header id="header" class="header">
        <h1 class="header_logo">
            <a href="/">archive.hpyhdm.me</a>
        </h1>
        <nav class="header_nav">
            <a href="https://hpyhdm.me" target="_blank" rel="noopener">Portfolio</a>
            <a href="https://github.com/hpyhdm/motion-archive" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>

    <div id="container" class="container">
        <main class="archive">
            <div class="desc_wrap">
                <p class="archive_desc">
                    <strong>Motion Archive</strong>
                    Interaction motion prototypes rebuilt from past web projects.
                </p>
                <p class="archive_stats" data-archive-stats></p></div>
            <!-- One group per project / 프로젝트별로 그룹을 하나씩 추가합니다 -->
            <section class="archive_group">
                <h2 class="archive_group_title">XI Elevator</h2>
                <ul>
                    <li class="archive_item">
                        <a href="/projects/xi-elevator/sticky-text-switch/">
                            <span>Sticky-text-switch</span>
                            <span class="archive_item_meta">Scroll · Pin · 2023</span>
                        </a>
                    </li>
                </ul>
            </section>
        </main>
    </div>
</div>

<script type="module">
    // Load shared base styles (web font + reset/layout) for the index page.
    // 목록 페이지에 공통 기본 스타일(웹폰트 + 리셋/레이아웃)을 불러옵니다.
    import "@shared/js/setup/base.js";
    import "./style.scss";
    import {initSmoothScroll} from "@shared/js/setup/smooth-scroll.js";
    import {renderArchiveStats} from "@shared/js/components/archive-stats.js";

    initSmoothScroll();
    renderArchiveStats();
</script>
</body>
</html>
