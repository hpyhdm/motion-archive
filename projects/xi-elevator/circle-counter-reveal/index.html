<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Circle counter reveal — XI Elevator | Motion Archive</title>
</head>
<body>
<div id="wrap">
    <div id="container" class="container">
        <div class="sec sec_intro">
            <div class="bg_video">
                <video src="/common/video/gray-flow.mp4" muted playsinline></video>
            </div>

            <div class="bg_dim"></div>

            <div class="ic_scroll_down">
                <img src="/common/images/ic_scroll_down.svg" alt="">
                <span>Scroll to explore</span>
            </div>

            <div class="circle_area">
                <div class="circle_inner">
                    <h2 class="title">Lorem ipsum 2035</h2>
                    <ul class="circle_list">
                        <li class="circle_item">
                            <div class="circle_txt">
                                <div class="num_box">
                                    <em class="num line">1</em>
                                    <em class="num fill" aria-hidden="true">1</em>
                                </div>
                                <span class="label">Lorem</span>
                                <strong class="value">10,000</strong>
                            </div>
                        </li>
                        <li class="circle_item">
                            <div class="circle_txt">
                                <div class="num_box">
                                    <em class="num line">2</em>
                                    <em class="num fill" aria-hidden="true">2</em>
                                </div>
                                <span class="label">Ipsum</span>
                                <strong class="value">2,000</strong>
                            </div>
                        </li>
                        <li class="circle_item">
                            <div class="circle_txt">
                                <div class="num_box">
                                    <em class="num line">3</em>
                                    <em class="num fill" aria-hidden="true">3</em>
                                </div>
                                <span class="label">Dolor</span>
                                <strong class="value">300</strong>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="./custom.js"></script>
</body>
</html>
